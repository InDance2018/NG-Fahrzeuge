plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.24'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'ng_fahrzeuge.persistencePhase', project.findProperty('persistencePhase') ?: 'none'
            mods {
                "${mod_id}" { source sourceSets.gametest }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

// Optional test fixture only: never adds NG Verkehr to the released mod's dependencies.
if (project.hasProperty('trafficIntegrationDir')) {
    repositories { flatDir { dirs project.property('trafficIntegrationDir') } }
    dependencies { runtimeOnly fg.deobf('nevergate:ng_verkehr:0.1.0-beta2-dev6') }
    sourceSets.gametest {
        java.srcDir 'src/trafficTest/java'
        compileClasspath += configurations.runtimeClasspath
    }
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                      mod_authors: mod_authors, mod_license: mod_license]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') { expand properties }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes('Specification-Title': mod_name,
                   'Specification-Vendor': mod_authors,
                   'Specification-Version': '1',
                   'Implementation-Title': project.name,
                   'Implementation-Version': mod_version,
                   'Implementation-Vendor': mod_authors)
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    finalizedBy 'reobfJar'
}

// Isolated visual regression scene; never included in the released mod JAR.
if (project.hasProperty('vehicleVisualTest')) {
    sourceSets {
        visualtest {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    minecraft.runs.client {
        mods { "${mod_id}" { source sourceSets.visualtest } }
        property 'ng_fahrzeuge.dev10Visual', project.hasProperty('vehicleVisualDev10') ? 'true' : 'false'
        property 'ng_fahrzeuge.dev9Visual', project.hasProperty('vehicleVisualDev9') ? 'true' : 'false'
        property 'ng_fahrzeuge.dev8Visual', project.hasProperty('vehicleVisualDev8') ? 'true' : 'false'
        property 'ng_fahrzeuge.dev7Visual', project.hasProperty('vehicleVisualDev7') ? 'true' : 'false'
        args '--quickPlaySingleplayer', project.hasProperty('vehicleVisualDev10') ? 'visual-dev10' : project.hasProperty('vehicleVisualDev9') ? 'visual-dev9' : project.hasProperty('vehicleVisualDev8') ? 'visual-dev8' : project.hasProperty('vehicleVisualDev7') ? 'visual-dev7' : 'visual-dev6', '--width', '1280', '--height', '800'
    }
}

// Original mono Vorbis assets are stored as UTF-8 base64 for repository transport.
def vehicleSoundsDir = layout.buildDirectory.dir('generated/vehicleSounds')
tasks.register('decodeVehicleSounds') {
    inputs.dir('src/main/sound-assets')
    outputs.dir(vehicleSoundsDir)
    doLast {
        def target = vehicleSoundsDir.get().dir('assets/ng_fahrzeuge/sounds').asFile
        target.mkdirs()
        fileTree('src/main/sound-assets').matching { include '*.ogg.b64' }.each { source ->
            new File(target, source.name.replace('.b64', '')).bytes = source.text.trim().decodeBase64()
        }
    }
}
sourceSets.main.resources.srcDir(vehicleSoundsDir)
tasks.named('processResources').configure { dependsOn 'decodeVehicleSounds' }
