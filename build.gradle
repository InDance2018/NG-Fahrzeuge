plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.24'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'ng_fahrzeuge.persistencePhase', project.findProperty('persistencePhase') ?: 'none'
            mods {
                "${mod_id}" { source sourceSets.gametest }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

// Optional test fixture only: never adds NG Verkehr to the released mod's dependencies.
if (project.hasProperty('trafficIntegrationDir')) {
    repositories { flatDir { dirs project.property('trafficIntegrationDir') } }
    dependencies { runtimeOnly fg.deobf('nevergate:ng_verkehr:0.1.0-beta2-dev6') }
    sourceSets.gametest {
        java.srcDir 'src/trafficTest/java'
        compileClasspath += configurations.runtimeClasspath
    }
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                      mod_authors: mod_authors, mod_license: mod_license]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') { expand properties }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes('Specification-Title': mod_name,
                   'Specification-Vendor': mod_authors,
                   'Specification-Version': '1',
                   'Implementation-Title': project.name,
                   'Implementation-Version': mod_version,
                   'Implementation-Vendor': mod_authors)
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    finalizedBy 'reobfJar'
}
